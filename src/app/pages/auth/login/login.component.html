<form [formGroup]="form" class="flex flex-col gap-5 w-full items-center" (ngSubmit)="login()">

  <h2>Se connecter</h2>

  <div class="flex flex-col w-full">
    <label for="email">Email</label>
    <input fluid="" type="email" pInputText id="email" autocomplete="off" formControlName="email"/>
  </div>

  <div class="flex flex-col w-full">
    <label for="password">Mot de passe</label>
    <p-password fluid="" formControlName="password" inputId="password" [toggleMask]="true" [feedback]="false" />
    <app-field-error [control]="form.get('password')"></app-field-error>
  </div>

  <a routerLink="/auth/password-forgotten" class="text-sm text-contrast-80 font-medium underline">Mot de passe oublié ?</a>

  <div class="w-full">
    <p-button label="Connexion" icon="bi bi-check-circle" type="submit" fluid=""
              [disabled]="form.invalid" [loading]="loading()"/>
  </div>

  <p class="text-body-light text-gris-100">
    Pas encore de compte >
    <a routerLink="/auth/register" class="text-primary-100 font-medium hover:underline">S'inscrire</a>
  </p>

</form>
