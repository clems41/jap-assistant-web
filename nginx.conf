# nginx.conf — jap-assistant production
#
# Architecture :
#   Browser → nginx (80/443)
#     ├── /api/*  → backend API (FastAPI/Django, port 8000)
#     └── /*      → Angular SSR Node server (port 4000)
#
# Upstreams — adapter les adresses selon l'environnement de déploiement.
# Pour un déploiement Docker, remplacer les noms d'hôtes par les noms de services docker-compose.

upstream api_backend {
    server localhost:8000;
    keepalive 32;
}

upstream ssr_server {
    server localhost:4000;
    keepalive 32;
}

# Redirection HTTP → HTTPS (décommenter en production avec TLS)
# server {
#     listen 80;
#     server_name jap-assistant.fr www.jap-assistant.fr;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;
    server_name _;

    # TLS (décommenter avec certificats Let's Encrypt)
    # ssl_certificate     /etc/letsencrypt/live/jap-assistant.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jap-assistant.fr/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy vers le backend API
    location /api/ {
        proxy_pass         http://api_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout  60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout  60s;

        # Pas de cache sur l'API
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Assets statiques Angular (hash dans le nom de fichier → cache long)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp|avif)$ {
        root /var/www/jap-assistant/browser;
        try_files $uri =404;

        # Cache 1 an pour les fichiers hashés
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Tout le reste → serveur SSR Angular Node
    location / {
        proxy_pass         http://ssr_server;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;

        # Fallback si le SSR est down (sert index.html pour le CSR)
        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback_csr;
    }

    # Fallback CSR si le serveur Node est indisponible
    location @fallback_csr {
        root  /var/www/jap-assistant/browser;
        index index.html;
        try_files /index.html =503;
        add_header Cache-Control "no-store";
    }
}
