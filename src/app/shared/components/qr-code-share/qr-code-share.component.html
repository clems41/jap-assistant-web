<div class="flex flex-col rounded-xl overflow-hidden border border-contrast-15 bg-blanc-100 shadow-sm">
  <div class="h-1 w-full bg-primary-100"></div>
  <div class="flex flex-col gap-4 p-4">
    <div class="flex flex-row items-center gap-2">
      <i class="bi bi-qr-code-scan text-primary-100"></i>
      <span class="text-title-4 text-contrast-100 font-poppins">Partager aux joueurs</span>
    </div>

    <p class="text-body-regular text-gris-120">
      Faites scanner ce QR code ou partagez le lien pour permettre aux joueurs de consulter les matchs du tournoi.
    </p>

    <div class="flex justify-center p-2 border border-contrast-15 rounded-lg bg-blanc-100">
      @if (qrCodeDataUrl(); as qrCode) {
        <img [src]="qrCode" alt="QR code vers la page publique des matchs du tournoi" width="224" height="224" class="w-56 h-56" />
      } @else {
        <div class="flex items-center justify-center w-56 h-56 text-gris-80">
          <i class="bi bi-qr-code text-title-1"></i>
        </div>
      }
    </div>

    <div class="flex flex-row w-full items-center gap-2">
      <input type="text" readonly [value]="url()" class="flex-1 min-w-0 truncate text-body-regular text-gris-120 bg-gris-5 border border-contrast-15 rounded-lg px-3 py-2" />
      <p-button icon="bi bi-clipboard" [outlined]="true" [cdkCopyToClipboard]="url()" (cdkCopyToClipboardCopied)="onCopy($event)" aria-label="Copier le lien" />
    </div>
  </div>
</div>
