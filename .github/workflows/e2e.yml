name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BACKEND_REPO }}
          token: ${{ secrets.BACKEND_TOKEN }}
          path: backend

      - name: Start backend (Docker Compose)
        working-directory: backend
        env:
          FRONTEND_URL: http://localhost:4200
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for backend to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/api/v1/tournaments/enums/categories/ > /dev/null 2>&1; do sleep 3; done'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: frontend
        env:
          CI: 'true'
          API_BASE: http://localhost:8000/api/v1
          MAILPIT_API: http://localhost:8025
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 3

      - name: Stop backend
        if: always()
        working-directory: backend
        run: docker compose -f docker-compose.test.yml down -v
