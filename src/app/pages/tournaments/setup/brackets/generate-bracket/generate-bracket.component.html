<app-loading-spinner [loading]="loading()"></app-loading-spinner>
<form (ngSubmit)="submit()" [formGroup]="form" class="flex flex-col gap-3 items-center justify-center w-full">
  <div class="flex flex-row gap-2 items-center">
    <h3>Paires inscrites : </h3>
    <span
      class="w-10 h-10 text-body-bold text-2xl flex items-center justify-center bg-contrast-100 text-blanc-100 rounded-full">
      {{ tournament().pairs_count }}</span>
  </div>
  <div class="flex flex-col w-1/3">
    <label for="dimension">Dimension du tableau</label>
    <p-select [options]="availableDimensions" formControlName="dimension" inputId="dimension" appendTo="body" fluid=""/>
  </div>
  <div class="flex flex-col w-1/3">
    <label for="nb_top_seeds">Nombre de tête de série</label>
    <p-select [options]="availableNbTopSeeds" formControlName="nb_top_seeds" inputId="nb_top_seeds" appendTo="body" fluid=""/>
  </div>
  <p-button label="Générer le tableau" icon="bi bi-check-circle" type="submit" fluid=""
            [disabled]="form.invalid" [loading]="loading()"/>
</form>
